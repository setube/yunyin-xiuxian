<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="一款文字版修仙放置游戏。一念修行 · 云深不知处。" />
    <!-- theme-color 由 src/core/theme.ts 在启动与主题切换时同步(亮/暗各一色) -->
    <meta name="theme-color" content="#F3EFE4" />
    <!--
      首帧主题:必须在样式与模块脚本之前跑完,否则暗色用户先看到一屏亮底
      (实测约 200ms,慢设备更久)。存档是加密的,内联脚本解不开,
      故读 __theme.ts 写的明文小键 yunyin.__theme;没有就跟随系统。
      颜色与 src/core/theme.ts 的 THEME_CHROME 互为手抄,改一处须改另一处。
    -->
    <script>
      ;(function () {
        try {
          var hint = localStorage.getItem('yunyin.__theme')
          var dark =
            hint === 'dark' ||
            (hint !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = dark ? '#211F1C' : '#F3EFE4'
        } catch (e) {
          /* 存储被禁:保持 index.html 里的亮色兜底 */
        }
      })()
    </script>
    <meta name="keywords" content="云隐修仙录,云隐,云隐修仙,修仙,修仙游戏,文字游戏,文字修仙,放置修仙,放置游戏" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="云隐修仙录" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="云隐修仙录 — 一念修行 · 云深不知处" />
    <meta property="og:description" content="文字版修仙放置游戏" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>云隐修仙录</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--
      统计代码勿删,须 defer:同步 <script> 会让首屏等它下载执行完。
      离线或被拦截时 LA 不存在,裸写 LA.init 会抛 ReferenceError;defer 脚本先于 DOMContentLoaded 执行完,故在此时初始化。
      autoTrack 开启即采集点击与滚动,改它须同步 public/privacy.html 与 PrivacyDialog.vue 的统计说明。
    -->
    <script defer charset="UTF-8" id="LA_COLLECT" src="https://sdk.51.la/js-sdk-pro.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        window.LA?.init({ id: 'LIx18788ryPZohY4', ck: 'LIx18788ryPZohY4', autoTrack: false, hashMode: true })
      })
    </script>
  </body>

</html>
