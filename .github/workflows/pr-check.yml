name: PR 校验

# 规则集「合并前必须通过的状态检查」;与 deploy.yml 的 main 闸门同一套(类型检查 + ESLint + 单测 + 构建)
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # conventional 校验分支内每个提交 + PR 标题(squash 合并会把 PR 标题直接写进主分支)
  commit-lint:
    name: 提交信息与标题校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # 依赖缓存:setup-bun 的缓存只覆盖 bun 可执行文件,不覆盖包本体
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 校验本分支全部提交 (conventional)
        # base..head 需要 fetch-depth: 0 的全量历史
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          n=0
          # --no-merges:merge 提交(如「Merge main into …」)不以 conventional 命名,不校验
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            n=$((n+1))
            # 无 --from/--to/--edit/--env 时 commitlint 从 stdin 读整条信息
            printf '%s' "$(git log -1 --format=%B "$c")" | bun run commitlint --verbose
          done
          echo "已校验 $n 个提交"
      - name: 校验 PR 标题 (conventional)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun run commitlint --verbose

  check:
    # 作业名即规则集引用的状态检查名,改名须同步规则集
    name: PR 校验
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # 依赖缓存:setup-bun 的缓存只覆盖 bun 可执行文件,不覆盖包本体
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查 + ESLint
        run: bun run check
      - name: 单元测试
        run: bun run test:report
      - name: 生产构建
        run: bun run build

  # 变异扫描:改坏一处守卫再跑对应 spec,不红就说明那句守卫没有判据守着。
  # 与本工作流其他 job 分开跑,是因为它要反复改写 src 下的源文件再还原 ——
  # 和「类型检查 + 单测 + 构建」串在同一个 job 里,失败时会把工作区停在半改状态,
  # 后面的步骤读到的是被改坏的源码。独立 job 各自一份干净检出。
  # 实耗约 1 分 15 秒(16 处检查),与 20 分钟的总超时相比可忽略。
  mutation-scan:
    name: 变异扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # 依赖缓存:setup-bun 的缓存只覆盖 bun 可执行文件,不覆盖包本体
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 改坏守卫验证判据
        run: bun run mutation-scan
