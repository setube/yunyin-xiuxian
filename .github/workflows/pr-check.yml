name: PR 校验

# 外部贡献走 PR:这一道就是规则集里「合并前必须通过的状态检查」。
# 与 deploy.yml 对 main 的闸门同一套(类型检查 + ESLint + 单测 + 构建),
# 只是提前到合并之前 —— 红了就合不进去,而不是合进去之后 Pages 部署才红。
on:
  pull_request:
    branches: [main]

# 同一个 PR 连续推送时,只保留最新一次运行
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 提交信息与 PR 标题的一卡通:conventional commit 格式。
  # 主分支最近一次是 squash 合并的主题行(round 254: …),不带 type 前缀 ——
  # squash 合并会把 PR 标题直接写进主分支,故这里两道都拦:分支内每个提交 + PR 标题。
  commit-lint:
    name: 提交信息与标题校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 校验本分支全部提交 (conventional)
        # fetch-depth: 0 才拉得到 base..head 的全量历史;base 即目标主干
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          n=0
          # --no-merges:分支间同步产生的 merge 提交(如「Merge main into …」)不算作品,
          # GitHub 自带的那些不以 conventional 命名,只校验本分支真正写的提交。
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            n=$((n+1))
            # 不带 --from/--to/--edit/--env 时,commitlint 从 stdin 读整条信息
            printf '%s' "$(git log -1 --format=%B "$c")" | bun run commitlint --verbose
          done
          echo "已校验 $n 个提交"
      - name: 校验 PR 标题 (conventional)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun run commitlint --verbose

  check:
    # 作业名就是规则集里引用的状态检查名,改名须同步改规则集
    name: PR 校验
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查 + ESLint
        run: bun run check
      - name: 单元测试
        run: bun run test:report
      - name: 生产构建
        run: bun run build
